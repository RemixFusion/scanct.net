<mat-drawer-container class="scanct-shell" autosize>
  <mat-drawer
    #searchPanel
    class="scanct-drawer search"
    mode="over"
    position="start"
    [autoFocus]="false"
  >
    <mat-toolbar color="primary">
      <span>Search calls</span>
      <span class="spacer"></span>
      <button mat-icon-button (click)="searchPanel.close()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-toolbar>
    <div class="drawer-body" #searchBody>
      <rdio-scanner-search></rdio-scanner-search>
    </div>
  </mat-drawer>

  <mat-drawer
    #selectPanel
    class="scanct-drawer select"
    mode="over"
    position="end"
    [autoFocus]="false"
  >
    <mat-toolbar color="primary">
      <span>Talkgroup control</span>
      <span class="spacer"></span>
      <button mat-icon-button (click)="selectPanel.close()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-toolbar>
    <div class="drawer-body" #selectBody>
      <rdio-scanner-select></rdio-scanner-select>
    </div>
  </mat-drawer>

  <mat-drawer-content>
    <div class="scanct-app">
      <mat-toolbar class="scanct-toolbar" color="primary">
        <div class="brand">
          <span class="logo">Scan CT</span>
          <span class="tagline">Connecticut statewide scanner dashboard</span>
        </div>
        <span class="flex-spacer"></span>
        <div class="toolbar-actions">
          <button mat-icon-button matTooltip="Start live feed" color="primary" (click)="start()" [disabled]="livefeedRunning">
            <mat-icon>play_arrow</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Stop live feed" color="primary" (click)="stop()" [disabled]="livefeedIdle">
            <mat-icon>stop</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Search archive" (click)="openSearch()">
            <mat-icon>search</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Talkgroup picker" (click)="openSelect()">
            <mat-icon>tune</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Toggle fullscreen" (click)="toggleFullscreen()">
            <mat-icon>fullscreen</mat-icon>
          </button>
        </div>
      </mat-toolbar>

      <div class="scanct-content">
        <rdio-scanner-main
          class="scanct-main"
          (openSearchPanel)="openSearch()"
          (openSelectPanel)="openSelect()"
          (toggleFullscreen)="toggleFullscreen()"
        ></rdio-scanner-main>
      </div>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
